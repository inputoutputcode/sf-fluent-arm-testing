trigger:
  - chrpap-sf1-abuild

jobs:
  - job: Ubuntu_Build
    pool:
      vmImage: 'ubuntu-16.04'
  
    steps:
        - task: AzureCLI@2
          inputs:
            azureSubscription: 'Visual Studio Ultimate mit MSDN'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              echo 'ECHO: cd $HOME + ls'
              cd $HOME
              ls
              echo 'ECHO: cd .azure + ls'
              cd /.azure
              ls
              cat azureProfile.json
              cat accessTokens.json
            addSpnToEnvironment: true