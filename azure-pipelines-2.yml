trigger:
  - chrpap-sf1-abuild

jobs:
  - job: Ubuntu_Build
    pool:
      vmImage: 'ubuntu-16.04'
  
    steps:
        - task: AzureCLI@2
          inputs:
            azureSubscription: 'Visual Studio Ultimate mit MSDN'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              echo 'AZURE_CONFIG_DIR'
              echo $AZURE_CONFIG_DIR
              cd $AZURE_CONFIG_DIR
              ls -la
              cat azureProfile.json
              cat accessTokens.json
            addSpnToEnvironment: true