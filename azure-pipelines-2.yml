trigger:
  - chrpap-sf1-abuild

jobs:
  - job: Ubuntu_Build
    pool:
      vmImage: 'ubuntu-latest'
  
    steps:
        - task: AzureCLI@2
          inputs:
            azureSubscription: 'Visual Studio Ultimate mit MSDN'
            scriptType: 'bash'
            scriptLocation: 'inlineScript'
            inlineScript: |
              echo 'ECHO: change dir to ~ + ls'
              cd ~ 
              ls
              echo 'ECHO: change dir to /.azure + ls'
              cd /.azure
              ls
              cat azureProfile.json
              cat accessTokens.json
              echo 'ECHO: change dir to /home/vsts + ls'
              cd /home/vsts
              ls
              echo 'ECHO: change dir to /.azure + ls'
              cd /.azure
              ls
              cat azureProfile.json
              cat accessTokens.json
              echo 'ECHO: change dir to /tmp + ls'
              cd /tmp
              echo 'ECHO: ' + $PWD
              ls
              cd .azure
              echo 'ECHO: ' + $PWD
              ls
              cat accessTokens.json
            addSpnToEnvironment: true