# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:
- task: AzureCLI@2
  inputs:
    azureSubscription: 'Visual Studio Ultimate mit MSDN'
    scriptType: 'pscore'
    scriptLocation: 'inlineScript'
    inlineScript: |
      cd $env:AZURE_CONFIG_DIR
      Get-ChildItem -Recurse
      Get-Content azureProfile.json
      Get-Content accessTokens.json

    addSpnToEnvironment: true
